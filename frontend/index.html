<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BandzzBot — Rise/Fall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0B0E11;
    --panel: #12161C;
    --panel-border: #1F262E;
    --phosphor: #FFB454;
    --phosphor-dim: #8A6530;
    --green: #3ADB76;
    --red: #FF5C5C;
    --ink: #E7ECF0;
    --ink-dim: #64707D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 100;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    margin-bottom: 16px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-dim);
  }

  .dot.live {
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .dot.stopped {
    background: var(--red);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--phosphor);
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-dim);
    margin: 0 0 18px;
  }

  .scope-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  canvas#scope {
    display: block;
    width: 100%;
    height: 90px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px;
  }

  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
  }

  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    margin: 0;
  }

  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--red); }
  .stat-value.neutral { color: var(--ink); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid;
    cursor: pointer;
    transition: transform 0.1s ease;
    background: transparent;
  }

  button:active {
    transform: scale(0.97);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-start {
    color: var(--green);
    border-color: var(--green);
  }

  .btn-start.active {
    background: var(--green);
    color: var(--void);
  }

  .btn-stop {
    color: var(--red);
    border-color: var(--red);
  }

  .btn-stop.active {
    background: var(--red);
    color: var(--void);
  }

  .log-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px;
  }

  .log-header {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 10px;
  }

  .log-lines {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    max-height: 280px;
    overflow-y: auto;
  }

  .log-line {
    display: flex;
    gap: 8px;
    padding: 2px 0;
  }

  .log-time {
    color: var(--ink-dim);
    flex-shrink: 0;
  }

  .log-msg.info { color: var(--phosphor); }
  .log-msg.win { color: var(--green); }
  .log-msg.loss { color: var(--red); }
  .log-msg.pause { color: var(--ink-dim); }

  .empty-log {
    color: var(--ink-dim);
    font-style: normal;
  }
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="wrap">

  <div class="topbar">
    <div class="status-pill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">CONNECTING</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <h1>BandzzBot</h1>
  <p class="subtitle">RISE/FALL &middot; VOLATILITY 100 &middot; DEMO</p>

  <div class="scope-panel">
    <canvas id="scope"></canvas>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <p class="stat-label">Net P&amp;L today</p>
      <p class="stat-value neutral" id="netPnl">$0.00</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Win rate</p>
      <p class="stat-value neutral" id="winRate">0%</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Trades today</p>
      <p class="stat-value neutral" id="tradesToday">0</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Record</p>
      <p class="stat-value neutral" id="record">0W / 0L</p>
    </div>
  </div>

  <div class="controls">
    <button class="btn-start" id="startBtn">Start</button>
    <button class="btn-stop" id="stopBtn">Stop</button>
  </div>

  <div class="log-panel">
    <p class="log-header">Live log</p>
    <div class="log-lines" id="logLines">
      <div class="log-line"><span class="empty-log">Waiting for first data...</span></div>
    </div>
  </div>

</div>

<script>
  var STATUS_URL = '/.netlify/functions/status';
  var CONTROL_URL = '/.netlify/functions/control';

  function updateClock() {
    var now = new Date();
    document.getElementById('clock').textContent = now.toUTCString().slice(17, 25) + ' UTC';
  }
  setInterval(updateClock, 1000);
  updateClock();

  var canvas = document.getElementById('scope');
  var ctx = canvas.getContext('2d');
  var scopeData = [];
  var scopeLevel = 50;

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  for (var i = 0; i < 120; i++) scopeData.push(50);

  function drawScope() {
    var w = canvas.getBoundingClientRect().width;
    var h = canvas.getBoundingClientRect().height;

    scopeLevel += (Math.random() - 0.5) * 8;
    scopeLevel = Math.max(15, Math.min(85, scopeLevel));
    scopeData.push(scopeLevel);
    if (scopeData.length > 120) scopeData.shift();

    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = '#FFB454';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#FFB454';
    ctx.shadowBlur = 4;
    ctx.beginPath();

    for (var j = 0; j < scopeData.length; j++) {
      var x = (j / (scopeData.length - 1)) * w;
      var y = h - (scopeData[j] / 100) * h;
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    requestAnimationFrame(drawScope);
  }
  drawScope();

  function fmtMoney(n) {
    var sign = n >= 0 ? '+' : '-';
    return sign + '$' + Math.abs(n).toFixed(2);
  }

  function fmtTime(iso) {
    var d = new Date(iso);
    return d.toUTCString().slice(17, 25);
  }

  function render(data) {
    if (data.error) {
      document.getElementById('statusText').textContent = 'ERROR';
      return;
    }

    var dot = document.getElementById('statusDot');
    var statusText = document.getElementById('statusText');

    if (data.manualPause) {
      dot.className = 'dot stopped';
      statusText.textContent = 'STOPPED';
    } else if (data.cooldownPaused) {
      dot.className = 'dot stopped';
      statusText.textContent = 'COOLDOWN';
    } else {
      dot.className = 'dot live';
      statusText.textContent = 'RUNNING';
    }

    var netPnl = document.getElementById('netPnl');
    netPnl.textContent = fmtMoney(data.netProfit);
    netPnl.className = 'stat-value ' + (data.netProfit > 0 ? 'pos' : data.netProfit < 0 ? 'neg' : 'neutral');

    document.getElementById('winRate').textContent = Math.round(data.winRate) + '%';
    document.getElementById('tradesToday').textContent = data.tradesToday;
    document.getElementById('record').textContent = data.wins + 'W / ' + data.losses + 'L';

    document.getElementById('startBtn').className = 'btn-start' + (!data.manualPause ? ' active' : '');
    document.getElementById('stopBtn').className = 'btn-stop' + (data.manualPause ? ' active' : '');

    var logLines = document.getElementById('logLines');
    if (data.recentEvents && data.recentEvents.length > 0) {
      logLines.innerHTML = data.recentEvents.map(function(ev) {
        return '<div class="log-line"><span class="log-time">' + fmtTime(ev.time) + '</span><span class="log-msg ' + ev.level + '">' + ev.message + '</span></div>';
      }).join('');
    } else {
      logLines.innerHTML = '<div class="log-line"><span class="empty-log">No events yet - waiting for the bot to run.</span></div>';
    }
  }

  function poll() {
    fetch(STATUS_URL)
      .then(function(r) { return r.json(); })
      .then(render)
      .catch(function() {
        document.getElementById('statusText').textContent = 'OFFLINE';
      });
  }

  function sendControl(action) {
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = true;
    fetch(CONTROL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action })
    })
      .then(function(r) { return r.json(); })
      .then(function() {
        poll();
      })
      .finally(function() {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = false;
      });
  }

  document.getElementById('startBtn').addEventListener('click', function() {
    sendControl('start');
  });
  document.getElementById('stopBtn').addEventListener('click', function() {
    sendControl('stop');
  });

  poll();
  setInterval(poll, 5000);
</script>

</body>
</html>
